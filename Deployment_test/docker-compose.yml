services:
  # ─────────────────────────────────────────────────────────────
  # MLflow Tracking Server — remote registry, replaces local sqlite file
  # ─────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: binance-mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 1060
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --artifacts-destination /mlruns
      --serve-artifacts
      --uvicorn-opts "--forwarded-allow-ips=*"
      --allowed-hosts "*"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:1060
    ports:
      - "1060:1060"
    volumes:
      - ./mlflow:/mlflow
      - ./mlruns:/mlruns
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Online API (FastAPI) — /health, /predict for the fixed 30m BTC model
  # ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ../Online
      dockerfile: api/Dockerfile
    container_name: binance-api
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:1060
      - ROOT_PATH=/api
      - ACTIVE_HORIZONS=30m
    depends_on:
      - mlflow
    ports:
      - "1061:1061"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:1061/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────
  # Dashboard (Streamlit) — single "Predict" button, 30m BTC only
  # ─────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
    container_name: binance-dashboard
    environment:
      - ONLINE_API=http://api:1061
      - BATCH_API=http://batch-api:1062
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - STREAMLIT_SERVER_PORT=1063
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    depends_on:
      - api
      - batch-api
    ports:
      - "1063:1063"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:1063/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # ─────────────────────────────────────────────────────────────
  # Batch Analysis API — serves batch market analysis
  # ─────────────────────────────────────────────────────────────
  batch-api:
    build:
      context: ../Batch
      dockerfile: Dockerfile
    container_name: binance-batch-api
    ports:
      - "1062:1062"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:1062/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s